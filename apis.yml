aid: humans-anonymous
name: Humans Anonymous
description: Humans Anonymous is a consumer mobile application offering anonymous audio spaces for
  mental health and peer support, built on the premise that "being a human is hard" and no one should
  face it alone. Distributed as an iOS app, it lets people join anonymous, real-time audio rooms to
  talk and listen around mental wellbeing. Surfaced as a portfolio company of General Catalyst and
  added to the API Evangelist network; the company publishes a consumer product website (humansanon.com)
  with privacy and terms pages but exposes no public developer API, SDK, or documentation surface at
  this time.
